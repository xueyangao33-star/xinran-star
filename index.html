<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡皮巴拉温泉小镇</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf7f2;color:#243e37;font-family:system-ui,'PingFang SC',sans-serif;font-size:17px}button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:14px 20px;background:#e5eeea;color:#243e37;min-height:48px}button:hover{filter:brightness(.96)}button:focus-visible{outline:3px solid #7659bc;outline-offset:3px}.primary{background:#276b57;color:white}header{max-width:980px;margin:auto;padding:24px;display:flex;gap:15px;justify-content:space-between;align-items:center;flex-wrap:wrap}header strong{font-size:22px}main{max-width:900px;margin:auto;padding:0 20px 40px}h1{font-size:clamp(28px,5vw,42px);margin:15px 0}p{line-height:1.7}.hero{background:#d5e8dd;border-radius:30px;padding:30px;position:relative;overflow:hidden}.scene{height:170px;display:flex;justify-content:center;align-items:end;background:linear-gradient(transparent 66%,#96d4cc 66%);border-radius:55%;margin:12px auto 20px;max-width:430px}.capy{width:180px;height:120px;background:#b68a65;border-radius:75px 75px 40px 40px;position:relative;border:4px solid #76543c}.capy:before{content:'';position:absolute;width:23px;height:26px;border-radius:50%;background:#b68a65;border:4px solid #76543c;top:-12px;left:20px}.face{position:absolute;right:16px;top:34px;font-size:40px;color:#44372e}.orange{position:absolute;left:75px;top:-32px;font-size:34px}.steam{font-size:30px;color:#49746a;align-self:start}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:22px 0}.level{text-align:left;background:white;padding:20px;border:1px solid #d5e5dc}.level small{display:block;margin-top:10px;color:#526d62}.card{background:white;border-radius:28px;padding:24px;text-align:center;box-shadow:0 8px 28px #284c3710}.char{font-family:'Kaiti SC','STKaiti',serif;font-size:112px;line-height:1.5}.hint{min-height:70px;color:#436257;font-size:22px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px 0}.muted{font-size:14px;color:#52685f}.progress{height:9px;background:#d5e6dc;border-radius:10px;margin:18px 0;overflow:hidden}.progress div{height:100%;background:#3d9275}.rewards{font-size:30px;letter-spacing:8px}.table{width:100%;border-collapse:collapse;font-size:16px}.table td,.table th{padding:12px 6px;border-bottom:1px solid #dbe5e0;text-align:left}footer{font-size:14px;color:#53685f;padding:20px 0}summary{cursor:pointer;padding:12px}#notice{color:#7b4e15} @media(max-width:480px){header{padding:18px}.hero{padding:22px}.card{padding:18px}.char{font-size:96px}}
</style><header><strong>♨ 卡皮巴拉温泉小镇</strong><button id="parent">家长记录</button></header><main id="app"></main><script>
const raw=`蝌 kē 蝌蚪|蚪 dǒu 蝌蚪|脑 nǎo 脑袋|袋 dài 口袋|灰 huī 灰色|甩 shuǎi 甩尾巴|活 huó 生活|腿 tuǐ 小腿|教 jiāo 教书|迎 yíng 欢迎|嘴 zuǐ 嘴巴|龟 guī 乌龟|披 pī 披风|蹲 dūn 蹲下|肚 dù 肚子|鼓 gǔ 打鼓|汽 qì 汽水|越 yuè 越来越好|温 wēn 温暖|滴 dī 水滴|奔 bēn 奔跑|海 hǎi 大海|洋 yáng 海洋|发 fā 出发|坏 huài 坏了|没 mò 淹没|庄 zhuāng 村庄|稼 jià 庄稼|屋 wū 房屋|带 dài 带来|灾 zāi 灾害|种 zhòng 种树|管 guǎn 管理|植 zhí 植物|如 rú 如果|为 wéi 作为|脚 jiǎo 小脚|旅 lǚ 旅行|准 zhǔn 准备|备 bèi 准备|送 sòng 送给|纷 fēn 纷纷|挂 guà 挂上|挺 tǐng 挺立|钻 zuān 钻进|底 dǐ 底下|炸 zhà 炸开|离 lí 离开|粗 cū 粗细|得 dé 得到`;
const words=raw.split('|').map((s,i)=>{let[c,p,w]=s.split(' ');return {c,p,w,i,m:'教没种为得'.includes(c)}});
const names=['池塘新朋友','欢迎来小镇','披风小伙伴','温泉冒泡啦','海边小旅行','修整小木屋','种一片花园','准备去探险','挂起星星灯','温泉开张啦'];const gifts=['🌼','🎀','🍊','🦆','🐚','🏡','🌱','🎒','⭐','👑'];const key='hanzi-photo-50-v1';let state={records:{},done:[]},stored=true;try{const s=JSON.parse(localStorage.getItem(key));if(s&&s.records&&Array.isArray(s.done))state=s}catch(e){stored=false}let queue=[],pos=0,level=0,help=false,review=false;const app=document.getElementById('app');const today=()=>new Date().toLocaleDateString('sv-SE');function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){stored=false}}function home(){app.innerHTML=`<section class="hero"><span>你的慢悠悠冒险，开始啦</span><h1>和卡皮一起，点亮小镇</h1><p>一次探索 5 个字。需要帮助也没关系。</p><div class="scene" aria-label="头顶橘子的卡皮巴拉泡温泉"><span class="steam">♨</span><div class="capy"><span class="orange">🍊</span><span class="face">˘ ᴥ ˘</span></div></div><div class="rewards">${state.done.map(i=>gifts[i]).join(' ')||'🌿'}</div><p>已完成 ${state.done.length} 次小镇建设 / 10</p></section><div class="grid">${names.map((n,i)=>`<button class="level" data-level="${i}">${state.done.includes(i)?'✿':'○'} 第 ${i+1} 站<br><strong>${n}</strong><small>${words.slice(i*5,i*5+5).map(w=>w.c).join(' · ')}</small></button>`).join('')}</div><button id="review" class="primary">和老朋友再见一面</button><footer>亲子陪读版 · 孩子读字，家长确认 · 不录音、不计时、不扣分<br>按提供的课本第 108 页顺序：45 个生字＋5 个蓝色多音字。<br>${stored?'进度保存在当前浏览器；换设备不会自动同步。':'当前环境不能保存进度，请使用家长记录导出备份。'}</footer>`;app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));app.querySelector('#review').onclick=()=>{const list=words.filter(w=>state.records[w.c]);list.sort((a,b)=>(state.records[a.c].last||'').localeCompare(state.records[b.c].last||'')||(state.records[a.c].days.length-state.records[b.c].days.length));if(!list.length){start(0);return}queue=list.slice(0,5);review=true;pos=0;show()}}
function start(n){level=n;queue=words.slice(n*5,n*5+5);review=false;pos=0;show()}
function show(){help=false;const w=queue[pos];app.innerHTML=`<div class="actions"><button id="back">回小镇</button><span>${review?'老朋友重逢':names[level]} · ${pos+1} / ${queue.length}</span></div><div class="progress"><div style="width:${pos/queue.length*100}%"></div></div><section class="card"><p>卡皮想听你读这个字</p><div class="char">${w.c}</div><div class="hint" id="hint"> </div><button id="hintBtn">🍊 卡皮帮帮我</button><div class="actions"><button class="primary" id="yes">独立读出来了</button><button id="learn">一起学一下</button></div><p class="muted">由家长确认；本轮读音以教材为准。</p><p id="notice" aria-live="polite"></p></section>`;app.querySelector('#back').onclick=home;app.querySelector('#hintBtn').onclick=reveal;app.querySelector('#yes').onclick=()=>mark(!help);app.querySelector('#learn').onclick=()=>{reveal();app.querySelector('#notice').textContent='一起读一遍，再点“跟着读好了”就可以继续。'}}
function reveal(){help=true;let w=queue[pos];app.querySelector('#hint').textContent=w.p+' · '+w.w+(w.m?'（本课读音）':'');app.querySelector('#yes').textContent='跟着读好了';app.querySelector('#hintBtn').disabled=true}
function mark(independent){let w=queue[pos],r=state.records[w.c]||{attempts:0,days:[],help:0,last:''};r.attempts++;r.last=today();r.latest=independent;if(independent&&!r.days.includes(today()))r.days.push(today());if(!independent){r.help++;r.days=[]}state.records[w.c]=r;save();pos++;if(pos<queue.length)show();else finish()}
function finish(){if(!review&&!state.done.includes(level)){state.done.push(level);save()}app.innerHTML=`<section class="hero" style="text-align:center"><div class="rewards">${review?'🌿':gifts[level]}</div><h1>${review?'老朋友，又见面啦！':'小镇又漂亮了一点！'}</h1><p>${review?'谢谢你回来和汉字朋友打招呼。':'你和卡皮一起完成了「'+names[level]+'」。'}</p><p>${queue.map(w=>w.c).join('　')}</p><p>今天到这里也很棒。</p><button id="home" class="primary">带着礼物回小镇</button></section>`;app.querySelector('#home').onclick=home}
function parents(){app.innerHTML=`<h1>家长记录</h1><p>“独立读出”只代表本次表现；不同日期独立读出两次，标记为“跨日读出”，仍需在纸质词句中验证。</p><div class="actions"><button id="home">回小镇</button><button id="export">导出记录</button></div><table class="table"><thead><tr><th>字 / 音</th><th>词语</th><th>认读记录</th></tr></thead><tbody>${words.map(w=>{let r=state.records[w.c];return `<tr><td>${w.c} ${w.p}${w.m?'＊':''}</td><td>${w.w}</td><td>${!r?'待探索':!r.latest?'借助提示':r.days.length>=2?'跨日读出':'本次独立读出'}</td></tr>`}).join('')}</tbody></table><p class="muted">＊蓝色多音字按照片所注读音练习。完成关卡与熟练程度分开记录。提示中的词语供家长辅助，不纳入这 50 字的测评范围。</p>`;app.querySelector('#home').onclick=home;app.querySelector('#export').onclick=()=>{const b=new Blob([JSON.stringify({source:'用户提供教材第108页，前三课50项',words,state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='卡皮识字记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}document.getElementById('parent').onclick=parents;home();
</script></html>
