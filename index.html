function advance(){if(phase===0&&!heard)return;if(phase>0&&!answered)return;pos++;if(pos===queue.length){phase++;pos=0;queue=shuffle(base)}if(phase<3)show();else showMatch()}
let matchLeft=[],matchRight=[],matchPairs=[],matchSelection={left:null,right:null};
function showMatch(){document.getElementById('townHome').hidden=false;stop();matchLeft=shuffle(base);matchRight=shuffle(base);matchPairs=[];matchSelection={left:null,right:null};app.innerHTML=`<div class="quiz"><div class="actions"><button id="matchBack">回小镇</button><span>④ 连连看 · ${review?'老朋友复习':names[level]}</span></div><section class="card"><h1>帮汉字找拼音</h1><p>点一个汉字，再点它的拼音。<br>也可以先点拼音哦。</p><div id="matchCount" class="match-count">已配对 0 / ${base.length}</div><div class="match-board" id="matchBoard"><svg class="match-lines" id="matchLines" aria-hidden="true"></svg><div class="match-col">${matchLeft.map((w,i)=>`<button class="match-tile" id="ml${i}" data-side="left" data-index="${i}" aria-pressed="false">${w.c}</button>`).join('')}</div><div class="match-col">${matchRight.map((w,i)=>`<button class="match-tile" id="mr${i}" data-side="right" data-index="${i}" aria-pressed="false">${w.p}</button>`).join('')}</div></div><div id="matchMessage" class="message" aria-live="polite">卡皮在等你牵好五对小伙伴。</div><button class="primary next" id="matchFinish" hidden>全部配好了，领取礼物</button></section></div>`;app.querySelector('#matchBack').onclick=home;app.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>selectMatch(b.dataset.side,Number(b.dataset.index)));app.querySelector('#matchFinish').onclick=()=>{if(matchPairs.length===base.length)finish()};if(typeof ResizeObserver!=='undefined'){if(window.matchObserver)window.matchObserver.disconnect();window.matchObserver=new ResizeObserver(drawMatches);window.matchObserver.observe(app.querySelector('#matchBoard'))}}
function selectMatch(side,i){const used=matchPairs.some(p=>p[side]===i);if(used)return;const prior=matchSelection[side];if(prior!==null)app.querySelector('#'+(side==='left'?'ml':'mr')+prior).setAttribute('aria-pressed','false');matchSelection[side]=prior===i?null:i;if(matchSelection[side]!==null)app.querySelector('#'+(side==='left'?'ml':'mr')+i).setAttribute('aria-pressed','true');if(matchSelection.left===null||matchSelection.right===null)return;const l=matchSelection.left,r=matchSelection.right,w=matchLeft[l];const valid=w.p===matchRight[r].p;const record=state.auto[w.c]||{listen:{tries:0,first:0},sound:{tries:0,first:0},days:[],last:today()};record.match=record.match||{attempts:0,correct:0};record.match.attempts++;if(valid)record.match.correct++;state.auto[w.c]=record;save();for(const id of ['#ml'+l,'#mr'+r])app.querySelector(id).setAttribute('aria-pressed','false');matchSelection={left:null,right:null};if(!valid){app.querySelector('#matchMessage').textContent='这两个还不合适，再找找它的小伙伴。';return}matchPairs.push({left:l,right:r});for(const id of ['#ml'+l,'#mr'+r]){const b=app.querySelector(id);b.disabled=true;b.classList.add('matched')}app.querySelector('#matchCount').textContent='已配对 '+matchPairs.length+' / '+base.length;app.querySelector('#matchMessage').textContent=matchPairs.length===base.length?'✨ 五对小伙伴都牵好手啦！':'✨ 配对成功！继续找下一对吧。';app.querySelector('#matchFinish').hidden=matchPairs.length!==base.length;drawMatches()}
function drawMatches(){const board=app.querySelector('#matchBoard');if(!board)return;const box=board.getBoundingClientRect();app.querySelector('#matchLines').innerHTML=matchPairs.map(p=>{const a=app.querySelector('#ml'+p.left).getBoundingClientRect(),b=app.querySelector('#mr'+p.right).getBoundingClientRect();return `<line x1="${a.right-box.left}" y1="${a.top+a.height/2-box.top}" x2="${b.left-box.left}" y2="${b.top+b.height/2-box.top}"/>`}).join('')}
function finish(){document.getElementById('townHome').hidden=false;stop();if(!review&&!state.autoDone.includes(level)){state.autoDone.push(level);save()}app.innerHTML=`<section class="card success"><div class="rewards">${review?'🌿':gifts[level]}</div><h1>和卡皮一起完成啦！</h1><p>认识、听音、选拼音、连连看，四步都完成啦。</p><p>${base.map(w=>w.c).join('　')}</p>${scene()}<p>今天到这里也很棒。</p><button id="home" class="primary">带着礼物回小镇</button></section>`;app.querySelector('#home').onclick=home}
function parents(){document.getElementById('townHome').hidden=false;stop();app.innerHTML=`<h1>学习记录</h1><p>记录的是选择辨认表现，不代表能独立朗读。提示后或重试后选对，会单独标记。旧版家长确认记录仍然保留。</p><div class="actions"><button id="home">回小镇</button><button id="export">导出记录</button></div><div class="records">${words.map(w=>{let r=state.auto[w.c];const label=t=>!t||!t.tries?'未练习':t.latest?'首次选对':'提示或重试后选对';return `<div class="record"><strong>${w.c} ${w.p}<small>${w.w}</small></strong><div><small>听音找字：${label(r?.listen)}</small><small>看字选音：${label(r?.sound)}</small>${r?.match?'<small>连连看：'+r.match.correct+' 次配对成功 / '+r.match.attempts+' 次尝试</small>':''}${state.records[w.c]?'<small>另有旧版家长确认记录</small>':''}</div></div>`}).join('')}</div><p class="muted">45 个生字＋5 个蓝色多音字，按提供的课本第 108 页前三课顺序。语音为系统合成；多音字播放词语后，再播放从词语录音中截取的目标字读音。</p>`;app.querySelector('#home').onclick=home;app.querySelector('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({words,state},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='卡皮识字记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}document.getElementById('parent').onclick=parents;document.getElementById('townHome').onclick=home;home();
</script></html>
