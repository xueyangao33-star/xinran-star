<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡皮巴拉温泉小镇</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf7f2;color:#243e37;font-family:system-ui,'PingFang SC',sans-serif;font-size:17px}button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:14px 20px;background:#e5eeea;color:#243e37;min-height:48px}button:hover{filter:brightness(.96)}button:focus-visible{outline:3px solid #7659bc;outline-offset:3px}.primary{background:#276b57;color:white}header{max-width:980px;margin:auto;padding:24px;display:flex;gap:15px;justify-content:space-between;align-items:center;flex-wrap:wrap}header strong{font-size:22px}main{max-width:900px;margin:auto;padding:0 20px 40px}h1{font-size:clamp(28px,5vw,42px);margin:15px 0}p{line-height:1.7}.hero{background:#d5e8dd;border-radius:30px;padding:30px;position:relative;overflow:hidden}.scene{height:170px;display:flex;justify-content:center;align-items:end;background:linear-gradient(transparent 66%,#96d4cc 66%);border-radius:55%;margin:12px auto 20px;max-width:430px}.capy{width:180px;height:120px;background:#b68a65;border-radius:75px 75px 40px 40px;position:relative;border:4px solid #76543c}.capy:before{content:'';position:absolute;width:23px;height:26px;border-radius:50%;background:#b68a65;border:4px solid #76543c;top:-12px;left:20px}.face{position:absolute;right:16px;top:34px;font-size:40px;color:#44372e}.orange{position:absolute;left:75px;top:-32px;font-size:34px}.steam{font-size:30px;color:#49746a;align-self:start}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:22px 0}.level{text-align:left;background:white;padding:20px;border:1px solid #d5e5dc}.level small{display:block;margin-top:10px;color:#526d62}.card{background:white;border-radius:28px;padding:24px;text-align:center;box-shadow:0 8px 28px #284c3710}.char{font-family:'Kaiti SC','STKaiti',serif;font-size:112px;line-height:1.5}.hint{min-height:70px;color:#436257;font-size:22px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px 0}.muted{font-size:14px;color:#52685f}.progress{height:9px;background:#d5e6dc;border-radius:10px;margin:18px 0;overflow:hidden}.progress div{height:100%;background:#3d9275}.rewards{font-size:30px;letter-spacing:8px}.table{width:100%;border-collapse:collapse;font-size:16px}.table td,.table th{padding:12px 6px;border-bottom:1px solid #dbe5e0;text-align:left}footer{font-size:14px;color:#53685f;padding:20px 0}summary{cursor:pointer;padding:12px}#notice{color:#7b4e15} @media(max-width:480px){header{padding:18px}.hero{padding:22px}.card{padding:18px}.char{font-size:96px}}

button{touch-action:manipulation;transition:transform .12s}button:active{transform:scale(.96)}button:disabled{opacity:.6;cursor:default}body{padding-bottom:env(safe-area-inset-bottom)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.level{padding:16px}.level small{overflow-wrap:anywhere}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:20px 0}.option{font-size:28px;min-height:76px;padding:10px;background:#edf4f0;border:2px solid transparent}.option.correct{border-color:#2d795e;background:#d7eedf}.option.retry{border-color:#a78bc5}.stepbar{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin:16px 0}.stepbar .active{color:#5e398b;font-weight:700}.hint{min-height:54px}.char{font-size:100px}.message{min-height:52px;line-height:1.5}.next{width:100%;margin-top:12px}.scene{height:130px}.capy{height:90px;width:145px}.face{font-size:30px;top:22px}.hero{padding:22px}.records{display:grid;gap:10px}.record{background:white;border-radius:16px;padding:14px;display:flex;justify-content:space-between;gap:15px}.record small{display:block;font-size:14px;line-height:1.7}.intro-actions{display:flex;gap:10px;flex-wrap:wrap}.quiz{max-width:680px;margin:auto}.success{animation:bloom .5s ease-out}@keyframes bloom{from{transform:scale(.94)}to{transform:scale(1)}}@media(min-width:760px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.hero{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:center}.records{grid-template-columns:1fr 1fr}}@media(max-width:480px){header{padding:14px}header strong{font-size:18px}header button{padding:10px;font-size:14px}main{padding:0 14px 24px}.card{padding:18px}.options{gap:8px}.option{font-size:25px}.char{font-size:88px}.hero h1{font-size:28px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><header><strong>♨ 卡皮巴拉温泉小镇</strong><button id="parent">家长记录</button></header><main id="app"></main><script>
const raw=`蝌 kē 蝌蚪|蚪 dǒu 蝌蚪|脑 nǎo 脑袋|袋 dài 口袋|灰 huī 灰色|甩 shuǎi 甩尾巴|活 huó 生活|腿 tuǐ 小腿|教 jiāo 教书|迎 yíng 欢迎|嘴 zuǐ 嘴巴|龟 guī 乌龟|披 pī 披风|蹲 dūn 蹲下|肚 dù 肚子|鼓 gǔ 打鼓|汽 qì 汽水|越 yuè 越来越好|温 wēn 温暖|滴 dī 水滴|奔 bēn 奔跑|海 hǎi 大海|洋 yáng 海洋|发 fā 出发|坏 huài 坏了|没 mò 淹没|庄 zhuāng 村庄|稼 jià 庄稼|屋 wū 房屋|带 dài 带来|灾 zāi 灾害|种 zhòng 种树|管 guǎn 管理|植 zhí 植物|如 rú 如果|为 wéi 作为|脚 jiǎo 小脚|旅 lǚ 旅行|准 zhǔn 准备|备 bèi 准备|送 sòng 送给|纷 fēn 纷纷|挂 guà 挂上|挺 tǐng 挺立|钻 zuān 钻进|底 dǐ 底下|炸 zhà 炸开|离 lí 离开|粗 cū 粗细|得 dé 得到`;
const words=raw.split('|').map((s,i)=>{let[c,p,w]=s.split(' ');return {c,p,w,i,m:'教没种为得'.includes(c)}});
const names=['池塘新朋友','欢迎来小镇','披风小伙伴','温泉冒泡啦','海边小旅行','修整小木屋','种一片花园','准备去探险','挂起星星灯','温泉开张啦'];const gifts=['🌼','🎀','🍊','🦆','🐚','🏡','🌱','🎒','⭐','👑'];const key='hanzi-photo-50-v1';let state={records:{},done:[],auto:{},autoDone:[]},stored=true;try{const s=JSON.parse(localStorage.getItem(key));if(s&&s.records&&Array.isArray(s.done))state={...state,...s}}catch(e){stored=false}state.auto=state.auto||{};state.autoDone=state.autoDone||[];
const app=document.getElementById('app');let queue=[],base=[],pos=0,level=0,phase=0,help=false,miss=0,answered=false,review=false,heard=false;let player=null;const today=()=>new Date().toLocaleDateString('sv-SE');
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){stored=false}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stop(){if(player){player.pause();player=null}}
function scene(){return `<div class="scene" aria-label="头顶橘子的卡皮巴拉泡温泉"><span class="steam">♨</span><div class="capy"><span class="orange">🍊</span><span class="face">˘ ᴥ ˘</span></div></div>`}
function home(){stop();let next=names.findIndex((_,i)=>!state.autoDone.includes(i));if(next<0)next=0;app.innerHTML=`<section class="hero"><div><span>自主探险 · 每关 5 个字</span><h1>和卡皮一起学汉字</h1><p>认识它 · 听音找字 · 看字选音</p><div class="intro-actions"><button class="primary" id="continue">${state.autoDone.length?'继续冒险':'开始冒险'}</button><button id="review">老朋友复习</button></div></div><div>${scene()}<div class="rewards">${[...new Set([...state.done,...state.autoDone])].map(i=>gifts[i]).join(' ')||'🌿'}</div></div></section><p>自主闯关完成 ${state.autoDone.length} / 10 关</p><div class="grid">${names.map((n,i)=>`<button class="level" data-level="${i}">${state.autoDone.includes(i)?'✿':'○'} 第 ${i+1} 站<br><strong>${n}</strong><small>${words.slice(i*5,i*5+5).map(w=>w.c).join(' · ')}</small></button>`).join('')}</div><footer>点播放按钮听中文读音。无需录音或家长确认。<br>${stored?'进度仅保存在当前浏览器，不跨设备同步。':'当前无法保存，请在家长记录中导出备份。'}</footer>`;app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(+b.dataset.level));app.querySelector('#continue').onclick=()=>start(next);app.querySelector('#review').onclick=()=>{let a=words.filter(w=>state.auto[w.c]);if(!a.length){start(0);return}a.sort((a,b)=>state.auto[a.c].last.localeCompare(state.auto[b.c].last));base=a.slice(0,5);review=true;phase=0;pos=0;queue=shuffle(base);show()}}
function start(n){level=n;base=words.slice(n*5,n*5+5);queue=[...base];review=false;phase=0;pos=0;show()}
function choices(w){const field=phase===1?'c':'p';let seen=new Set([w[field]]);let others=shuffle(words).filter(x=>{if(seen.has(x[field]))return false;seen.add(x[field]);return true}).slice(0,2);return shuffle([w,...others])}
function show(){stop();help=false;miss=0;answered=false;heard=false;const w=queue[pos];app.innerHTML=`<div class="quiz"><div class="actions"><button id="back">回小镇</button><span>${review?'老朋友复习':names[level]} · ${pos+1} / ${queue.length}</span></div><div class="stepbar">${['① 认识它','② 听音找字','③ 看字选音'].map((x,i)=>`<span class="${phase===i?'active':''}">${x}</span>`).join('')}</div><div class="progress"><div style="width:${(phase*queue.length+pos)/(queue.length*3)*100}%"></div></div><section class="card"><p>${['先听一听，认识新朋友','听一听，哪个字来做客？','这个字的拼音是哪一个？'][phase]}</p>${phase===1?'<div class="char" aria-hidden="true">🎧</div>':`<div class="char">${w.c}</div>`}<div class="hint" id="hint"></div>${phase<2?'<button id="play" class="primary">🔊 '+(phase===0?'听读音':'播放题目')+'</button>':''}${phase===0?'<div class="actions"><button id="help">看看拼音和词语</button></div>':`<div class="options">${choices(w).map(x=>`<button class="option" ${phase===1?'disabled':''} data-value="${x[phase===1?'c':'p']}">${x[phase===1?'c':'p']}</button>`).join('')}</div><button id="help">🍊 卡皮帮帮我</button>`}<div class="message" id="message" aria-live="polite">${phase===1?'先播放，再选字。':phase===0?'点一下，听卡皮读给你听。':'按课本里学过的读音选择。'}</div><button class="primary next" id="next" ${phase===0?'disabled':'hidden'}>${phase===0?'认识啦，继续':'继续探险'}</button></section></div>`;app.querySelector('#back').onclick=home;app.querySelector('#help').onclick=()=>{if(phase>0)help=true;app.querySelector('#hint').textContent=w.c+' · '+w.p+' · '+w.w;app.querySelector('#help').disabled=true};if(phase<2)app.querySelector('#play').onclick=()=>play(w);app.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>answer(b,w));app.querySelector('#next').onclick=advance}
function play(w){stop();const audio=new Audio('audio/'+w.i+'.wav');player=audio;const msg=app.querySelector('#message');audio.onended=()=>{if(player!==audio)return;heard=true;msg.textContent=phase===0?'可以再听一遍，也可以继续。':'现在选一个字吧。';if(phase===0)app.querySelector('#next').disabled=false;else app.querySelectorAll('[data-value]').forEach(b=>{if(!answered&&!b.dataset.wrong)b.disabled=false})};audio.onerror=()=>{if(player===audio)msg.textContent='声音暂时没有加载好，请检查网络后再点播放。'};audio.play().catch(()=>{if(player===audio)msg.textContent='播放未成功，请打开设备声音后再点一次播放。'})}
function answer(b,w){if(answered||(phase===1&&!heard)||b.disabled)return;const right=w[phase===1?'c':'p'];if(b.dataset.value!==right){miss++;b.disabled=true;b.dataset.wrong='1';b.classList.add('retry');app.querySelector('#message').textContent='这个还不合适，再试一次。也可以找卡皮帮忙。';return}answered=true;b.classList.add('correct');stop();app.querySelectorAll('[data-value]').forEach(x=>x.disabled=true);app.querySelector('#help').disabled=true;const r=state.auto[w.c]||{listen:{tries:0,first:0},sound:{tries:0,first:0},last:'',days:[]};const type=phase===1?'listen':'sound';r[type].tries++;if(!miss&&!help)r[type].first++;r[type].latest=(!miss&&!help);r.last=today();if(!miss&&!help&&!r.days.includes(today()))r.days.push(today());state.auto[w.c]=r;save();app.querySelector('#message').textContent=miss||help?'🌱 找到了！我们又熟悉了一点。':'✨ 找对啦！';app.querySelector('#next').hidden=false}
function advance(){if(phase===0&&!heard)return;if(phase>0&&!answered)return;pos++;if(pos===queue.length){phase++;pos=0;queue=shuffle(base)}if(phase<3)show();else finish()}
function finish(){stop();if(!review&&!state.autoDone.includes(level)){state.autoDone.push(level);save()}app.innerHTML=`<section class="card success"><div class="rewards">${review?'🌿':gifts[level]}</div><h1>和卡皮一起完成啦！</h1><p>认识、听音、选拼音，三步都走过啦。</p><p>${base.map(w=>w.c).join('　')}</p>${scene()}<p>今天到这里也很棒。</p><button id="home" class="primary">带着礼物回小镇</button></section>`;app.querySelector('#home').onclick=home}
function parents(){stop();app.innerHTML=`<h1>学习记录</h1><p>记录的是选择辨认表现，不代表能独立朗读。提示后或重试后选对，会单独标记。旧版家长确认记录仍然保留。</p><div class="actions"><button id="home">回小镇</button><button id="export">导出记录</button></div><div class="records">${words.map(w=>{let r=state.auto[w.c];const label=t=>!t||!t.tries?'未练习':t.latest?'首次选对':'提示或重试后选对';return `<div class="record"><strong>${w.c} ${w.p}<small>${w.w}</small></strong><div><small>听音找字：${label(r?.listen)}</small><small>看字选音：${label(r?.sound)}</small>${state.records[w.c]?'<small>另有旧版家长确认记录</small>':''}</div></div>`}).join('')}</div><p class="muted">45 个生字＋5 个蓝色多音字，按提供的课本第 108 页前三课顺序。语音为系统合成，播放词语再读汉字，多音字以标注拼音为准。</p>`;app.querySelector('#home').onclick=home;app.querySelector('#export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({words,state},null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='卡皮识字记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}document.getElementById('parent').onclick=parents;home();
</script></html>
